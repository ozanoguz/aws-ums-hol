<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab control room</title><style>
:root{color-scheme:dark;--muted:#97a8bf;--line:#29374b;--green:#63e6b3}*{box-sizing:border-box}body{margin:0;background:#0c1320;color:#ecf2fa;font:15px/1.5 system-ui}main{max-width:880px;margin:48px auto;padding:0 24px}header,.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:26px;letter-spacing:-.035em;margin:0}.live,.legend,footer{font-size:12px;color:var(--muted)}details{position:relative}summary{cursor:pointer;list-style:none;border:1px solid var(--line);padding:9px 14px;border-radius:8px;background:#172236;min-width:190px}summary:after{content:' ▾';float:right;margin-left:12px}summary::-webkit-details-marker{display:none}.menu{position:absolute;top:46px;left:0;background:#172236;border:1px solid #384961;border-radius:10px;padding:12px;width:265px;z-index:5;box-shadow:0 20px 45px #0006}.actions{display:flex;gap:8px;padding-bottom:10px}button{background:#26364d;color:inherit;border:1px solid #42536c;border-radius:6px;padding:6px 12px;cursor:pointer}.choices{max-height:340px;overflow:auto}.choices label{display:flex;gap:12px;align-items:center;padding:6px 4px;cursor:pointer}input{accent-color:var(--green);width:16px;height:16px}.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#111c2c}.row{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:17px 22px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.student{font-weight:600;font-variant-numeric:tabular-nums}.lights{display:flex;gap:12px;flex-wrap:wrap}.light{display:block;width:25px;height:25px;background:#354357;border:1px solid #526075;border-radius:5px}.light.healthy{background:#397dae;border-color:#67a8d7}.light.verified{background:var(--green);border-color:#a7f6d9}.light.missing{background:transparent;border-style:dashed;opacity:.45}.light.flash{animation:blink 1s ease-out}.empty{padding:30px;color:var(--muted);text-align:center}footer{margin-top:18px}@keyframes blink{0%,40%{background:#fff;box-shadow:0 0 20px #63e6b3aa}100%{background:var(--green)}}@media(prefers-reduced-motion:reduce){.light.flash{animation:none}}@media(max-width:550px){main{margin:26px auto;padding:0 16px}.toolbar{align-items:start;flex-direction:column}h1{font-size:23px}.row{padding:16px}}

/* Classroom view: 35 accounts in five columns at desktop sizes. */
main{max-width:1600px;margin:20px auto;padding:0 24px}header{margin-bottom:16px}.toolbar{margin-bottom:16px}.list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;background:transparent;border:0;border-radius:0;overflow:visible}.row{min-width:0;border:1px solid var(--line);border-radius:9px;padding:14px 12px;background:#111c2c;gap:10px}.row:last-child{border-bottom:1px solid var(--line)}.student{font-size:14px}.lights{gap:6px;flex-wrap:nowrap}.light{width:18px;height:18px;flex-shrink:0}.empty{grid-column:1/-1}footer{margin-top:12px}.row.instructor{border-color:#6086b6;background:#15283e}@media(min-width:1000px) and (max-height:760px){main{margin:12px auto}.row{padding:10px 12px}header,.toolbar{margin-bottom:12px}.list{gap:8px}}@media(max-width:1100px){.list{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:850px){.list{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{gap:8px}}@media(max-width:420px){.list{grid-template-columns:1fr}}
</style></head><body><main><header><h1>Lab control room</h1><span id="connection" class="live" role="status">Connecting…</span></header><div class="toolbar"><details id="selector"><summary id="selection-label">Student accounts</summary><div class="menu"><div class="actions"><button id="select-all" type="button">All</button><button id="select-none" type="button">None</button></div><div class="choices" id="choices"></div></div></details><span class="legend">Blue: healthy · Green: verified · Flash: traffic</span></div><section class="list" id="students" aria-label="Selected students"></section><footer>Each square represents a FortiGate. Gray: unavailable or stale. Outline: awaiting discovery.</footer></main><script src="/dashboard.js"></script></body></html>
