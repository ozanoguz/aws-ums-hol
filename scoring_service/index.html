<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab control room</title><style>
:root{color-scheme:dark;--muted:#8da0ba;--line:#26374e;--green:#65e3b0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#15243c 0,transparent 55%),#0a111e;color:#edf3fb;font:14px/1.45 system-ui}main{max-width:1800px;margin:24px auto;padding:0 28px}header,.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}h1{font-size:29px;letter-spacing:-.04em;margin:0}.eyebrow{font-size:10px;letter-spacing:.2em;color:#80aaf1;font-weight:700;margin-bottom:4px}.subtitle{margin:5px 0 0;color:var(--muted);font-size:12px}.live{font-size:12px;color:var(--green);border:1px solid var(--line);padding:7px 12px;border-radius:20px}.legend,footer{font-size:11px;color:var(--muted)}details{position:relative}summary{cursor:pointer;list-style:none;border:1px solid var(--line);padding:10px 14px;border-radius:8px;background:#172236;min-width:190px}summary:after{content:' ▾';float:right;margin-left:12px}summary::-webkit-details-marker{display:none}.menu{position:absolute;top:46px;left:0;background:#172236;border:1px solid #384961;border-radius:10px;padding:12px;width:265px;z-index:5;box-shadow:0 20px 45px #0006}.actions{display:flex;gap:8px;padding-bottom:10px}button{background:#26364d;color:inherit;border:1px solid #42536c;border-radius:6px;padding:6px 12px;cursor:pointer}.choices{max-height:340px;overflow:auto}.choices label{display:flex;gap:12px;align-items:center;padding:6px 4px;cursor:pointer}input{accent-color:var(--green);width:16px;height:16px}.list{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));grid-auto-rows:var(--card-height,180px)}.row{display:flex;flex-direction:column;justify-content:space-between;min-width:0;border:1px solid var(--line);border-radius:12px;padding:18px;background:linear-gradient(135deg,#142135,#101b2c);box-shadow:0 5px 15px #0001}.row.instructor{border-color:#5d88ba;background:linear-gradient(135deg,#1b3550,#112337)}.card-head,.card-metrics{display:flex;justify-content:space-between;align-items:center;gap:8px}.student{font-size:18px;font-weight:650;letter-spacing:-.025em}.badge{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:#8eb9f1}.web-status{font-size:11px;white-space:nowrap;color:var(--muted)}.web-status.up{color:var(--green)}.web-status.down{color:#e2b881}.lights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.node{background:#0b1423aa;border:1px solid #25364d;border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px;min-width:0}.light{display:block;width:26px;height:26px;flex-shrink:0;background:#354357;border:1px solid #526075;border-radius:6px}.light.healthy{background:#397dae;border-color:#67a8d7}.light.verified{background:var(--green);border-color:#a7f6d9}.light.missing{background:transparent;border-style:dashed;opacity:.5}.light.flash{animation:blink 1s ease-out}.node-caption{font-size:10px;color:var(--muted);white-space:nowrap}.card-metrics{font-size:11px;color:var(--muted)}.phase{color:#b9c9df}.phase.complete{color:var(--green)}.progress{display:flex;gap:4px;margin-top:10px}.progress span{height:3px;flex:1;background:#29374b;border-radius:2px}.progress .done{background:var(--green)}.empty{grid-column:1/-1;padding:30px;color:var(--muted);text-align:center}.list.compact .row{padding:12px}.list.compact .student{font-size:16px}.list.compact .node{padding:8px;justify-content:center}.list.compact .node-caption{display:none}.list.compact .lights{margin:7px 0;gap:6px}.list.compact .light{width:22px;height:22px}.list.dense .row{padding:9px 11px;border-radius:9px}.list.dense .student{font-size:14px}.list.dense .node{border:0;background:none;padding:0;justify-content:flex-start}.list.dense .light{width:20px;height:20px}.list.dense .lights{margin:5px 0}.list.dense .progress{margin-top:5px}.list.dense .card-metrics,.list.dense .web-status{font-size:10px}.list.dense .badge,.list.dense .phase{display:none}footer{margin-top:14px}@keyframes blink{0%,40%{background:#fff;box-shadow:0 0 22px #63e6b3aa}100%{background:var(--green)}}@media(prefers-reduced-motion:reduce){.light.flash{animation:none}}@media(max-width:600px){main{margin:16px auto;padding:0 16px}.toolbar{align-items:start;flex-direction:column;gap:8px}h1{font-size:24px}.subtitle{display:none}.node-caption{display:none}}
.service-status{display:flex;flex-direction:column;align-items:flex-end;gap:3px}.fmg-status{font-size:11px;color:var(--muted);white-space:nowrap}.fmg-status.deployed{color:#80b8f3}.list.dense .fmg-status{font-size:10px}.list.dense .row{padding-top:7px;padding-bottom:7px}.list.dense .lights{margin:3px 0}</style></head><body><main><header><div><div class="eyebrow">FORTIMANAGER UMS · CLASSROOM</div><h1>Lab control room</h1><p class="subtitle">Deployment, scale-out and live inspection at a glance.</p></div><span id="connection" class="live" role="status">Connecting…</span></header><div class="toolbar"><details id="selector"><summary id="selection-label">Student accounts</summary><div class="menu"><div class="actions"><button id="select-all" type="button">All</button><button id="select-none" type="button">None</button></div><div class="choices" id="choices"></div></div></details><span class="legend">Blue: healthy · Green: verified · Flash: traffic</span></div><section class="list" id="students" aria-label="Selected students"></section><footer>Live inspection flashes only after a matched probe. Outlined nodes are awaiting discovery.</footer></main><script src="/dashboard.js"></script></body></html>
